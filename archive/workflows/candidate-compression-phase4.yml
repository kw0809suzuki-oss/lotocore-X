name: LOTO7 Candidate Compression Phase 4 State Observables

on:
  workflow_dispatch:
  push:
    paths:
      - 'coverage_lab/state_observables.py'
      - 'coverage_lab/fixed_k_curve.py'
      - 'lotocore.py'
      - 'x_agent.py'
      - 'fetch_loto7.py'
      - '.github/workflows/candidate-compression-phase4.yml'

jobs:
  state-observables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Build fixed-K curve
        run: python coverage_lab/fixed_k_curve.py --data data/loto7.csv --window 100
      - name: Observe pre-target state metrics
        run: python coverage_lab/state_observables.py --data data/loto7.csv --curve results/loto7_candidate_compression_fixed_k.csv --window 100
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-compression-phase4-state-observables
          path: |
            results/loto7_candidate_compression_fixed_k.csv
            results/loto7_candidate_compression_state_observables.csv
