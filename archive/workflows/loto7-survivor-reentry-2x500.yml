name: LOTO7 Survivor Reentry 2x500
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_loto7_survivor_reentry_shard.py'
      - 'aggregate_loto7_survivor_reentry_shards.py'
      - '.github/workflows/loto7-survivor-reentry-2x500.yml'

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - run: python probe_loto7_survivor_reentry_shard.py
        env:
          SHARD_INDEX: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: loto7-survivor-reentry-shard-${{ matrix.shard }}
          path: results/loto7_survivor_reentry_shard_${{ matrix.shard }}.csv

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - uses: actions/download-artifact@v4
        with:
          pattern: loto7-survivor-reentry-shard-*
          path: results
          merge-multiple: true
      - run: python aggregate_loto7_survivor_reentry_shards.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto7-survivor-reentry-2x500
          path: results/loto7_survivor_reentry_2x500.csv
