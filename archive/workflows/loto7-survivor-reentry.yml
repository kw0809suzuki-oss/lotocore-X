name: LOTO7 Survivor Reentry Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_loto7_survivor_reentry.py'
      - '.github/workflows/loto7-survivor-reentry.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - run: python probe_loto7_survivor_reentry.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto7-survivor-reentry
          path: results/loto7_survivor_reentry_probe.csv
