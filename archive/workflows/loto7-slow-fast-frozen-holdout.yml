name: LOTO7 Slow Fast Frozen Holdout
on:
  workflow_dispatch:
  push:
    paths:
      - 'probe_loto7_slow_fast_frozen_holdout.py'
      - '.github/workflows/loto7-slow-fast-frozen-holdout.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - run: python probe_loto7_slow_fast_frozen_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto7-slow-fast-frozen-holdout
          path: results/loto7_slow_fast_frozen_holdout.csv
