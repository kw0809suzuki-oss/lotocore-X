name: LOTO6 Residual Local Shape v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-residual-local-v0
    paths:
      - 'playground/loto6-residual-local/**'
      - '.github/workflows/loto6-residual-local-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Observe Residual magnitude versus next-draw extraction
        run: python playground/loto6-residual-local/residual_local_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-residual-local-v0
          path: results/loto6_residual_local_v0.json
          if-no-files-found: error
