name: LOTO7 FG NearMiss Pokopoko Subgroup v1

on:
  workflow_dispatch:
  push:
    branches:
      - 'probe/loto7-a-world-box-state-v0'
    paths:
      - 'probe_loto7_fg_nearmiss_pokopoko_subgroup_v1.py'
      - '.github/workflows/loto7-fg-nearmiss-pokopoko-subgroup-v1.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - run: python probe_loto7_fg_nearmiss_pokopoko_subgroup_v1.py
