name: LOTO7 Closure Structure v0

on:
  push:
    paths:
      - 'probe_loto7_closure_structure_v0.py'
      - '.github/workflows/loto7-closure-structure-v0.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Run closure structure probe
        run: python probe_loto7_closure_structure_v0.py --window 100 --discovery-targets 400 --discovery-bundles 160 --holdout-bundles 400
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: loto7-closure-structure-v0
          path: |
            results/loto7_closure_structure_v0_holdout.csv
            results/loto7_closure_structure_v0_summary.json
