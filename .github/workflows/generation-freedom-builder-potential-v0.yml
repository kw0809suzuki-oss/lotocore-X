name: Generation Freedom Builder Potential v0

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/generation-freedom-builder-potential-v0-20261003
    paths:
      - "coverage_lab/generation_freedom_builder_potential_v0.py"
      - ".github/workflows/generation-freedom-builder-potential-v0.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: pip install pandas

      - name: Run potential probe
        run: python coverage_lab/generation_freedom_builder_potential_v0.py

      - name: Show result
        run: cat results/generation_freedom_builder_potential_v0.json

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: generation-freedom-builder-potential-v0
          path: results/generation_freedom_builder_potential_v0.json
