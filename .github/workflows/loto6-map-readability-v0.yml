name: LOTO6 Map Readability v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-map-readability-v0
    paths:
      - 'playground/loto6-map-readability/**'
      - '.github/workflows/loto6-map-readability-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Measure strict-forward map readability
        run: python playground/loto6-map-readability/map_readability.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-map-readability-v0
          path: results/loto6_map_readability_v0.json
          if-no-files-found: error
