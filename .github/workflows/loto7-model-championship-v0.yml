name: LOTO7 Model Championship v0

on:
  push:
    branches:
      - experiment/loto7-model-championship-v0
    paths:
      - compare_loto7_model_championship_v0.py
      - .github/workflows/loto7-model-championship-v0.yml
  workflow_dispatch:

jobs:
  championship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Build fixed-K curve
        run: python coverage_lab/fixed_k_curve.py --data data/loto7.csv --window 100
      - name: Build state observations
        run: python coverage_lab/state_observables.py --data data/loto7.csv --curve results/loto7_candidate_compression_fixed_k.csv --window 100
      - name: Run GitHub-side championship
        run: python compare_loto7_model_championship_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto7-model-championship-v0
          path: results/loto7_model_championship_v0_github.csv
