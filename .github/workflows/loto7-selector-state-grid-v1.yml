name: LOTO7 Selector State Grid v1
on:
  workflow_dispatch:
  push:
    branches: ['probe/loto7-a-world-box-state-v0']
    paths:
      - 'probe_loto7_selector_state_grid_v1.py'
      - '.github/workflows/loto7-selector-state-grid-v1.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - run: python probe_loto7_selector_state_grid_v1.py
