name: LOTO7 CORE Net v0

on:
  push:
    paths:
      - 'probe_loto7_core_net_v0.py'
      - '.github/workflows/loto7-core-net-v0.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fixed CORE18 conversion probe
        run: python probe_loto7_core_net_v0.py --random-reps 200
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: loto7-core-net-v0
          path: results/loto7_core_net_v0.json
