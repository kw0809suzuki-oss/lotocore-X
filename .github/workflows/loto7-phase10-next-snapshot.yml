name: LOTO7 Phase 10 Next Pre-Draw 10-Ticket Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'coverage_lab/current_10ticket_snapshot.py'
      - 'coverage_lab/practical_10ticket_backtest.py'
      - 'coverage_lab/state_observables.py'
      - 'coverage_lab/fixed_k_curve.py'
      - 'x_agent.py'
      - 'fetch_loto7.py'
      - '.github/workflows/loto7-phase10-next-snapshot.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Build fixed-K curve
        run: python coverage_lab/fixed_k_curve.py --data data/loto7.csv --window 100
      - name: Build state observations
        run: python coverage_lab/state_observables.py --data data/loto7.csv --curve results/loto7_candidate_compression_fixed_k.csv --window 100
      - name: Freeze next pre-draw 10-ticket bundle
        run: python coverage_lab/current_10ticket_snapshot.py --data data/loto7.csv --state results/loto7_candidate_compression_state_observables.csv --model-window 100
      - uses: actions/upload-artifact@v4
        with:
          name: loto7-phase10-next-pre-draw-bundle
          path: |
            results/loto7_phase10_next_bundle.json
            data/loto7.csv
