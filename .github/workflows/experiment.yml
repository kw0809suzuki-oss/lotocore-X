name: LotoCore X Experiment

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch Loto7 history
        run: python fetch_loto7.py --limit 700
      - name: Run walk-forward comparison
        run: python walk_forward.py --window 100
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: lotocore-x-results
          path: results/latest.csv
