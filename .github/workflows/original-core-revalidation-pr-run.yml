name: original-core-revalidation-pr-run

on:
  pull_request:
    branches: [main]

jobs:
  run:
    if: github.head_ref == 'original-core-revalidation-v0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-core-revalidation-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python original_core_revalidation/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-core-revalidation-result
          path: results/original_core_revalidation/
