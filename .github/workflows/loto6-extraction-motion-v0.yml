name: LOTO6 Extraction Motion v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-extraction-motion-v0
    paths:
      - 'playground/loto6-extraction-motion/**'
      - '.github/workflows/loto6-extraction-motion-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Compare actual extraction motion with random-world cloud
        run: python playground/loto6-extraction-motion/motion_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-extraction-motion-v0
          path: results/loto6_extraction_motion_v0.json
          if-no-files-found: error
