name: LOTO7 B Residual Matched v1

on:
  push:
    paths:
      - 'probe_loto7_b_residual_matched_v1.py'
      - '.github/workflows/loto7-b-residual-matched-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Run matched residual probe
        run: python probe_loto7_b_residual_matched_v1.py --window 100 --pool 800 --eps 0.05
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: loto7-b-residual-matched-v1
          path: |
            results/loto7_b_residual_matched_v1_pairs.csv
            results/loto7_b_residual_matched_v1_summary.json
