name: LOTO6 Map x LOTO7 Shape Play v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-map-shape-play-v0
    paths:
      - 'playground/loto6-map-shape-play/**'
      - '.github/workflows/loto6-map-shape-play-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Run movement-map x shape play
        run: python playground/loto6-map-shape-play/map_shape_play.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-map-shape-play-v0
          path: results/loto6_map_shape_play_v0.json
          if-no-files-found: error
