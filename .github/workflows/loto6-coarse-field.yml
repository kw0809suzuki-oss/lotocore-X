name: LOTO6 Coarse Field Map

on:
  push:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch 400 LOTO6 draws
        run: python fetch_loto6.py --limit 400
      - name: Build coarse field map
        run: python check_loto6_coarse_field.py
      - name: Upload coarse field result
        uses: actions/upload-artifact@v4
        with:
          name: loto6-coarse-field-400
          path: |
            results/loto6_coarse_field_states.csv
            results/loto6_coarse_field_summary.csv
            data/loto6.csv
