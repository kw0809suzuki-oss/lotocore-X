name: local-phenomenon-generator-v0-smoke

on:
  push:
    branches:
      - local-phenomenon-generator-v0
    paths:
      - "phenomenon_generator/**"
      - ".github/workflows/local-phenomenon-generator-v0.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        working-directory: phenomenon_generator
        run: python -m unittest discover -p "test_*.py"
      - name: Compile
        run: python -m py_compile phenomenon_generator/*.py
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 1000
      - name: Random20 vs Astra20 play
        run: python phenomenon_generator/batch_random_vs_astra_play.py
      - name: Astra next-distance probe
        run: python phenomenon_generator/next_distance_probe.py --random-samples 200 | tee astra-next-distance.txt
      - name: Flow vs Astra observation comparison
        run: python phenomenon_generator/compare_flow_astra_random.py --random-samples 500 | tee flow-astra-random.txt
      - name: External Random Flow Astra play
        run: python phenomenon_generator/external_threeway_play.py --seed 20261004 --count 40 --rows-out external-threeway-rows.json | tee external-threeway-summary.txt
      - name: Upload Astra next-distance result
        uses: actions/upload-artifact@v4
        with:
          name: astra-next-distance
          path: astra-next-distance.txt
      - name: Upload Flow Astra Random result
        uses: actions/upload-artifact@v4
        with:
          name: flow-astra-random
          path: flow-astra-random.txt
      - name: Upload external threeway result
        uses: actions/upload-artifact@v4
        with:
          name: external-threeway
          path: |
            external-threeway-summary.txt
            external-threeway-rows.json
      - name: Audit Astra Model
        run: python phenomenon_generator/audit_astra_model.py
