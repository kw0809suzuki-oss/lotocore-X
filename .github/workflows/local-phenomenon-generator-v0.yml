name: local-phenomenon-generator-v0-smoke

on:
  push:
    branches:
      - local-phenomenon-generator-v0
    paths:
      - "phenomenon_generator/**"
      - ".github/workflows/local-phenomenon-generator-v0.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        working-directory: phenomenon_generator
        run: python -m unittest discover -p "test_*.py"
      - name: Compile
        run: python -m py_compile phenomenon_generator/*.py
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 1000
      - name: Random20 vs Astra20 play
        run: python phenomenon_generator/batch_random_vs_astra_play.py
      - name: Astra next-distance probe
        run: python phenomenon_generator/next_distance_probe.py --random-samples 200 | tee astra-next-distance.txt
      - name: Upload Astra next-distance result
        uses: actions/upload-artifact@v4
        with:
          name: astra-next-distance
          path: astra-next-distance.txt
      - name: Audit Astra Model
        run: python phenomenon_generator/audit_astra_model.py
