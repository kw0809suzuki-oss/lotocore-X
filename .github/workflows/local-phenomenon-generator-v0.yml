name: local-phenomenon-generator-v0-smoke

on:
  push:
    branches:
      - local-phenomenon-generator-v0
    paths:
      - "phenomenon_generator/**"
      - ".github/workflows/local-phenomenon-generator-v0.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        working-directory: phenomenon_generator
        run: python -m unittest discover -p "test_*.py"
      - name: Compile
        run: python -m py_compile phenomenon_generator/generator.py phenomenon_generator/cli.py phenomenon_generator/audit_examples.py
      - name: Run all example recipes
        working-directory: phenomenon_generator
        run: |
          for f in examples/*.json; do python cli.py "$f" > /tmp/$(basename "$f"); done
      - name: Audit example edit sizes
        working-directory: phenomenon_generator
        run: python audit_examples.py
