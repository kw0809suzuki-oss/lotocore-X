name: LOTO6 SHARP18 v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-sharp18-v0
    paths:
      - 'playground/loto6-sharp18/**'
      - '.github/workflows/loto6-sharp18-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Measure path-conditioned Shape18
        run: python playground/loto6-sharp18/sharp18_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-sharp18-v0
          path: results/loto6_sharp18_v0.json
          if-no-files-found: error
