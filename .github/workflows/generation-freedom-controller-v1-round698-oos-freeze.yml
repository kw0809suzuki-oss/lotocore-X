name: Generation Freedom Controller v1 Round698 OOS Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/generation-freedom-controller-v1-validation-20261003
    paths:
      - "coverage_lab/generation_freedom_controller_v1_round698_oos_freeze.py"
      - "coverage_lab/fixtures/loto7_round697_public_20261002.csv"
      - ".github/workflows/generation-freedom-controller-v1-round698-oos-freeze.yml"

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: pip install pandas
      - name: Freeze round 698
        run: python coverage_lab/generation_freedom_controller_v1_round698_oos_freeze.py
      - name: Show freeze
        run: cat results/generation_freedom_controller_v1_round698_oos_freeze.json
      - name: Upload freeze
        uses: actions/upload-artifact@v4
        with:
          name: generation-freedom-controller-v1-round698-oos-freeze
          path: results/generation_freedom_controller_v1_round698_oos_freeze.json
