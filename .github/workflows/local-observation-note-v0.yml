name: local-observation-note-v0-smoke

on:
  push:
    branches:
      - local-observation-note-v0
    paths:
      - "local_observation_note/**"
      - ".github/workflows/local-observation-note-v0.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r local_observation_note/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s local_observation_note -p "test_*.py"
      - name: Compile app
        run: python -m py_compile local_observation_note/app.py local_observation_note/observer_core.py
