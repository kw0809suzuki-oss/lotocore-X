# Phase 10 practical ticket-level evidence\nname: LOTO7 Candidate Compression Phase 10 Practical 10-Ticket Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'coverage_lab/practical_10ticket_backtest.py'
      - 'coverage_lab/state_observables.py'
      - 'coverage_lab/fixed_k_curve.py'
      - 'x_agent.py'
      - 'fetch_loto7.py'
      - '.github/workflows/candidate-compression-phase10.yml'

jobs:
  practical-10ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Build fixed-K curve
        run: python coverage_lab/fixed_k_curve.py --data data/loto7.csv --window 100
      - name: Build state observations
        run: python coverage_lab/state_observables.py --data data/loto7.csv --curve results/loto7_candidate_compression_fixed_k.csv --window 100
      - name: Run practical 10-ticket strict-forward backtest
        run: python coverage_lab/practical_10ticket_backtest.py --data data/loto7.csv --state results/loto7_candidate_compression_state_observables.csv --history-window 60 --step 20 --model-window 100
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-compression-phase10-practical-10ticket
          path: |
            results/loto7_candidate_compression_fixed_k.csv
            results/loto7_candidate_compression_state_observables.csv
            results/loto7_phase10_practical_10ticket_backtest.csv
