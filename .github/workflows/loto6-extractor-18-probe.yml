name: LOTO6 Extractor 18 Probe

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-extractor-18-v0
    paths:
      - '.github/workflows/loto6-extractor-18-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Walk-forward 43 to 18 extraction probe
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, math
          from pathlib import Path
          from math import comb
          import requests

          URL = "https://www.mk-mode.com/rails/loto/LOTO6_ALL.csv"
          r = requests.get(URL, timeout=30, headers={"User-Agent":"lotocore-X research probe"})
          r.raise_for_status()
          try:
              text = r.content.decode("cp932")
          except UnicodeDecodeError:
              text = r.content.decode("utf-8")

          rows = []
          reader = csv.reader(io.StringIO(text))
          next(reader, None)
          for row in reader:
              try:
                  round_no = int(row[0])
                  draw = sorted(int(row[2+i]) for i in range(6))
                  if len(draw) == 6 and len(set(draw)) == 6 and all(1 <= n <= 43 for n in draw):
                      rows.append((round_no, draw))
              except Exception:
                  continue
          rows.sort(key=lambda x: x[0])
          if len(rows) < 300:
              raise RuntimeError(f"too few parsed rows: {len(rows)}")

          rounds = [r for r,_ in rows]
          nums = [d for _,d in rows]

          MIN_HISTORY = 100
          POOL = 18
          METHODS = ["hot20", "hot50", "hot100", "cold20", "due"]

          def counts(window):
              c = [0] * 44
              for draw in window:
                  for n in draw:
                      c[n] += 1
              return c

          def select_pool(i, method):
              history = nums[:i]
              if method.startswith("hot"):
                  w = int(method[3:])
                  c = counts(history[-w:])
                  ranked = sorted(range(1,44), key=lambda n: (-c[n], n))
              elif method == "cold20":
                  c = counts(history[-20:])
                  ranked = sorted(range(1,44), key=lambda n: (c[n], n))
              elif method == "due":
                  last = {}
                  for j, draw in enumerate(history):
                      for n in draw:
                          last[n] = j
                  ranked = sorted(range(1,44), key=lambda n: (-(i - 1 - last.get(n, -1)), n))
              else:
                  raise ValueError(method)
              return set(ranked[:POOL])

          den = comb(43, 6)
          null_p = {k: comb(18,k)*comb(25,6-k)/den for k in range(7)}
          null_mean = 6*18/43
          null_var = 6*(18/43)*(25/43)*((43-6)/(43-1))

          results = {}
          for method in METHODS:
              hits = []
              for i in range(MIN_HISTORY, len(nums)):
                  pool = select_pool(i, method)
                  hits.append(len(pool.intersection(nums[i])))
              mean = sum(hits)/len(hits)
              z = (mean-null_mean)/math.sqrt(null_var/len(hits))
              results[method] = {
                  "mean_hits": round(mean, 6),
                  "delta_vs_null": round(mean-null_mean, 6),
                  "z_vs_null": round(z, 4),
                  "p_ge3": round(sum(h>=3 for h in hits)/len(hits), 6),
                  "p_ge4": round(sum(h>=4 for h in hits)/len(hits), 6),
                  "p_ge5": round(sum(h>=5 for h in hits)/len(hits), 6),
                  "max_hits": max(hits),
                  "hit_hist": {str(k): hits.count(k) for k in range(7)},
              }

          out = {
              "source": URL,
              "source_rounds": [rounds[0], rounds[-1]],
              "draws": len(nums),
              "min_history": MIN_HISTORY,
              "eval_rounds": [rounds[MIN_HISTORY], rounds[-1]],
              "eval_n": len(nums)-MIN_HISTORY,
              "pool_size": POOL,
              "null": {
                  "mean_hits": round(null_mean, 6),
                  "p_ge3": round(sum(null_p[k] for k in range(3,7)), 6),
                  "p_ge4": round(sum(null_p[k] for k in range(4,7)), 6),
                  "p_ge5": round(sum(null_p[k] for k in range(5,7)), 6),
              },
              "methods": results,
              "boundary": "Exploratory only. Five extractors were compared on the same historical walk-forward window; no promotion claim."
          }
          Path("results").mkdir(exist_ok=True)
          Path("results/loto6_extractor_18_probe.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: loto6-extractor-18-probe
          path: results/loto6_extractor_18_probe.json
          if-no-files-found: error
