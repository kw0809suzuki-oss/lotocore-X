name: LOTO6 Consistency Threshold v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-consistency-threshold-v0
    paths:
      - 'playground/loto6-consistency-threshold/**'
      - '.github/workflows/loto6-consistency-threshold-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Measure consistency threshold curve
        run: python playground/loto6-consistency-threshold/consistency_threshold.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-consistency-threshold-v0
          path: results/loto6_consistency_threshold_v0.json
          if-no-files-found: error
