name: LOTO7 Frozen Box Win Rate Evaluation v0
on:
  workflow_dispatch:
  push:
    branches: ['probe/loto7-a-world-box-state-v0']
    paths:
      - 'eval_loto7_frozen_box_win_rate_v0.py'
      - '.github/workflows/loto7-frozen-box-win-rate-v0.yml'
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python fetch_loto7.py --limit 700
      - run: python eval_loto7_frozen_box_win_rate_v0.py
