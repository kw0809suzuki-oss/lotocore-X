name: original-core-revalidation-v0

on:
  push:
    branches:
      - original-core-revalidation-v0
    paths-ignore:
      - 'results/original_core_revalidation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: original-core-revalidation-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python original_core_revalidation/run.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/original_core_revalidation
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "save original core revalidation result [skip ci]"
            git push
          fi
