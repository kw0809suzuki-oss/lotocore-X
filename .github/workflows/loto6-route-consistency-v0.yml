name: LOTO6 Route Consistency v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-route-consistency-v0
    paths:
      - 'playground/loto6-route-consistency/**'
      - '.github/workflows/loto6-route-consistency-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Measure route consistency
        run: python playground/loto6-route-consistency/route_consistency.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-route-consistency-v0
          path: results/loto6_route_consistency_v0.json
          if-no-files-found: error
