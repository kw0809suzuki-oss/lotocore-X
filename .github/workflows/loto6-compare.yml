name: LOTO6 Core X Random Compare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'loto6_core.py'
      - 'loto6_x_agent.py'
      - 'walk_forward_loto6.py'
      - 'fetch_loto6.py'
      - '.github/workflows/loto6-compare.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch exactly 200 LOTO6 draws
        run: python fetch_loto6.py --limit 200
      - name: Run 100-draw holdout comparison
        run: python walk_forward_loto6.py --window 100
      - name: Upload comparison results and raw history
        uses: actions/upload-artifact@v4
        with:
          name: loto6-core-x-random-100-holdout
          path: |
            results/loto6_compare.csv
            data/loto6.csv
