name: LOTO6 Route Grammar Normalization v0

on:
  workflow_dispatch:
  push:
    branches:
      - probe/loto6-route-normalization-v0
    paths:
      - 'playground/loto6-route-normalization/**'
      - '.github/workflows/loto6-route-normalization-v0.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy requests
      - name: Normalize route grammar by intersection opportunity
        run: python playground/loto6-route-normalization/route_normalization_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: loto6-route-normalization-v0
          path: results/loto6_route_normalization_v0.json
          if-no-files-found: error
