name: LOTO7 Evidence Reduction Budget10 v0

on:
  push:
    branches:
      - experiment/evidence-reduction-budget10-v0-20261003
    paths:
      - coverage_lab/loto7_evidence_reduction_budget10_v0.py
      - .github/workflows/loto7-evidence-reduction-budget10-v0.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pandas
      - run: python coverage_lab/loto7_evidence_reduction_budget10_v0.py
      - run: cat results/loto7_evidence_reduction_budget10_v0.json
