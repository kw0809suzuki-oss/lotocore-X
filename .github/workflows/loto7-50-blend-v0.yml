name: LOTO7 50 Blend v0

on:
  push:
    paths:
      - 'probe_loto7_50_blend_v0.py'
      - '.github/workflows/loto7-50-blend-v0.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch LOTO7 history
        run: python fetch_loto7.py --limit 700
      - name: Run 50-ticket blend probe
        run: python probe_loto7_50_blend_v0.py --window 100 --pool 120 --keep 40 --plain-reps 100
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: loto7-50-blend-v0
          path: |
            results/loto7_50_blend_v0_rounds.csv
            results/loto7_50_blend_v0_summary.json
