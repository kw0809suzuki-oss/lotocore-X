name: Generation Freedom Controller v1 Inner Validation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/generation-freedom-controller-v1-validation-20261003
    paths:
      - "coverage_lab/generation_freedom_controller_v1_inner_validation.py"
      - ".github/workflows/generation-freedom-controller-v1-inner-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: pip install pandas
      - name: Run inner validation
        run: python coverage_lab/generation_freedom_controller_v1_inner_validation.py
      - name: Show result
        run: cat results/generation_freedom_controller_v1_inner_validation.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: generation-freedom-controller-v1-inner-validation
          path: results/generation_freedom_controller_v1_inner_validation.json
